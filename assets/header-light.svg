<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Santoshkumar Myakala</title>
  <desc id="d">Cloud Architect, DevOps and SRE, Platform Engineering, MLOps and AI Infrastructure</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/><stop offset="0.5" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d8e1ec" stroke-width="1"/></pattern>
    <radialGradient id="fade" cx="0.82" cy="0.5" r="0.55"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="m"><rect width="1200" height="260" fill="url(#fade)"/></mask>
    <style>
      .n{font:700 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328;letter-spacing:.5px}
      .r{font:500 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a;letter-spacing:.4px}
      .k{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0969da;letter-spacing:2px}
      .node{fill:#ffffff;stroke:#0969da;stroke-width:1.5}
      .edge{stroke:#8250df;stroke-width:1.5;fill:none;stroke-dasharray:4 6;animation:flow 3s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-40}}
      @media (prefers-reduced-motion:reduce){.edge{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)" mask="url(#m)"/>
  <!-- abstract platform topology -->
  <g transform="translate(850 40)">
    <path class="edge" d="M60 40 L170 40 M60 40 L110 130 M170 40 L230 130 M110 130 L230 130 M110 130 L60 180 M230 130 L280 180"/>
    <circle class="node" cx="60" cy="40" r="11"/><circle class="node" cx="170" cy="40" r="11"/>
    <circle class="node" cx="110" cy="130" r="14"/><circle class="node" cx="230" cy="130" r="11"/>
    <circle class="node" cx="60" cy="180" r="8"/><circle class="node" cx="280" cy="180" r="8"/>
  </g>
  <text class="k" x="64" y="78">PLATFORM · CLOUD · RELIABILITY</text>
  <text class="n" x="62" y="134">Santoshkumar Myakala</text>
  <rect x="64" y="154" width="420" height="3" rx="1.5" fill="url(#ac)"/>
  <text class="r" x="64" y="196">Cloud Architect  |  DevOps &amp; SRE  |  Platform Engineering  |  MLOps &amp; AI Infrastructure</text>
</svg>
