# Regenerates the contribution-graph animation and the all-time activity history daily into the `output` branch.
name: contribution-snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml", ".github/scripts/activity_history.py"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All-time contribution history (every year since the account was created)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/activity_history.py "${{ github.repository_owner }}" "$RUNNER_TEMP/activity"
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0969da&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff
      - name: Publish to the output branch
        run: |
          # dist/ is created by the action's container as root: publish from a fresh directory.
          mkdir -p "$RUNNER_TEMP/out" && cp dist/snake.svg dist/snake-dark.svg "$RUNNER_TEMP"/activity/*.svg "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg activity-dark.svg activity-light.svg
          git commit -q -m "Update contribution graphics"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
